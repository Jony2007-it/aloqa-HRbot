const fld=(k,lb,x)=>`<div class="${S.err[k]?"bad":""}">${lb?`<label>${lb}</label>`:""}${x}${S.err[k]?`<div class="er">${S.err[k]}</div>`:""}</div>`;

const sel=(k,lb,o)=>fld(k,lb,`<select data-s="${k}"><option value="">${L().pk}</option>${o.map((x,j)=>`<option value="${j}" ${S.D[k]===String(j)?"selected":""}>${esc(x)}</option>`).join("")}</select>`);
const chips=(k,o)=>`<div class="ch">${o.map((x,j)=>`<button class="c ${S.D[k]===j?"on":""}" data-c="${k}:${j}">${esc(x)}</button>`).join("")}</div>`;
const IC={v:'<svg viewBox="0 0 24 24"><path d="M3 8h18v11H3zM9 8V5h6v3"/></svg>',c:'<svg viewBox="0 0 24 24"><path d="M5 21V4h9v17M14 9h5v12M3 21h18M8 8h2M8 12h2M8 16h2"/></svg>',m:'<svg viewBox="0 0 24 24"><path d="M20 14A8 8 0 0110 4a8 8 0 1010 10z"/></svg>',s:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/></svg>',ca:'<svg viewBox="0 0 24 24"><path d="M4 6h16v14H4zM4 10h16M8 3v4M16 3v4"/></svg>',x:'<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',ck:'<svg viewBox="0 0 24 24" style="width:28px;height:28px"><path d="M5 12l5 5L20 7"/></svg>'};
const logo=w=>`<div class="lg" style="width:${w}px"><img class="k" src="logo-ink.png"><img class="b" src="logo-blue.png"></div>`;

function head(t){const d=document.documentElement.dataset.th;return`<header><h1>${esc(t)}</h1><div class="hr"><button class="ib" data-a="lm">${S.lang.toUpperCase()}</button><button class="ib" data-a="tg">${d=="dark"?IC.s:IC.m}</button>${S.lm?`<div class="menu">${["uz:O'zbekcha","ru:Русский","en:English"].map(x=>{const[a,b]=x.split(":");return`<button class="${a==S.lang?"on":""}" data-l="${a}">${b}</button>`}).join("")}</div>`:""}</div></header>`}

function wizard(){const l=L(),D=S.D,s=S.step;let h="";
 if(s==0)h=`<div class="row">${inp("fn",l.fn,"text",'autocomplete="given-name"')}${inp("ln",l.ln,"text",'autocomplete="family-name"')}</div>`;
 if(s==1)h=fld("ph",l.ph,`<div class="pf"><span>+998</span><input data-ph inputmode="numeric" placeholder="90 123 45 67" maxlength="12" value="${fp(D.ph)}"></div>`)+inp("em",l.em,"email",'autocapitalize="none" placeholder="name@mail.com"');
 if(s==2)h=fld("bd",l.bd,`<div class="pf"><input data-bd inputmode="numeric" placeholder="DD.MM.YYYY" maxlength="10" value="${esc(D.bd)}" style="padding-left:14px"><button class="ib" data-a="dp" style="border:0">${IC.ca}</button></div><input class="dp" type="date" id="dp">`);
 if(s==3)h=sel("lr",l.lr,RG.map(r=>r[I()]))+inp("ds",l.ds,"text");
 if(s==4)h=fld("vac","",VC.map((v,i)=>{const x=v[I()],exp=S.vopen===i;return`<div class="vch ${D.vac===i?"on":""}" style="--cc:${cc(i)};--cb:${hx(cc(i),.1)}"><div style="display:flex;align-items:center;gap:12px;cursor:pointer" data-c="vac:${i}">${vi(i)}<span style="flex:1;min-width:0"><b>${x[0]}</b><br><span class="mu sm">${x[1]}</span><span class="sal">${salIc}${l.neg}</span></span><u></u></div><button type="button" class="mu sm" data-vo="${i}" style="background:none;border:0;padding:9px 0 0;text-decoration:underline;cursor:pointer">${l.rm} ${exp?"▲":"▼"}</button>${exp?`<ul style="margin:6px 0 0 18px;color:var(--mu);font-size:12.5px">${x[2].map(r=>`<li>${r}</li>`).join("")}</ul>`:""}</div>`}).join(""));
 if(s==5)h=fld("ex","",chips("ex",EL[I()].concat(l.ot)))+(D.ex===7?`<div style="margin-top:10px"><input data-k="xt" placeholder="${l.exp}" value="${esc(D.xt)}"></div>`:"");
 if(s==6)h=fld("sal","",chips("sal",SL[I()].concat(l.ot)))+(D.sal===4?`<div style="margin-top:10px"><input data-k="salt" inputmode="numeric" placeholder="${l.salc}" value="${esc(D.salt)}"></div>`:"");
 if(s==7){const x=VC[D.vac][I()],rows=[[l.rv1,`${esc(D.fn)} ${esc(D.ln)}`],[l.rv2,"+998 "+fp(D.ph)],[l.rv3,esc(D.em)||"—"],[l.rv4,esc(D.bd)],[l.rv5,`${RG[D.lr][I()]}, ${esc(D.ds)}`],[l.rv6,x[0]],[l.rv7,D.ex===7?esc(D.xt):EL[I()][D.ex]],[l.rv8,D.sal===4?esc(D.salt)+" so'm":SL[I()][D.sal]]];
  h=`<div class="det-h">${vi(D.vac,"lg")}<span class="tx"><b>${x[0]}</b></span></div>`+rows.map(r=>`<div class="rv"><span>${r[0]}</span><b>${r[1]}</b></div>`).join("")+fld("cn","",`<label class="cb"><input type="checkbox" data-cb ${D.cn?"checked":""}>${l.cn}</label>`)+(S.st==3?`<div class="er" style="margin-top:10px">${l.er}</div>`:"");}
 const n=8,dots=Array.from({length:n},(_,i)=>`<i class="${i<=s?"on":""}"></i>`).join("");
 return head(l.w[s])+`<main><div class="dots">${dots}</div><div class="step">${h}</div></main><div class="ft">${s?`<button class="btn g" data-a="bk" style="flex:.6">${l.bk}</button>`:""}<button class="btn" data-a="nx" ${s==7&&S.st==1?"disabled":""}>${s==7?l.sn:l.nx}</button></div>`}

function success(){const l=L(),j=S.D.vac;return`<main><div class="ok" style="border-color:${cc(j)};color:${cc(j)}">${IC.ck}</div><h2 style="text-align:center">${l.sd}</h2><p class="mu" style="text-align:center">${l.sx}</p><button class="btn" data-a="fin" style="background:${cc(j)};margin-top:10px">${l.cl}</button></main>`}

function render(){theme();$("#app").innerHTML=S.st==2?success():wizard()}

function ok(){const D=S.D,l=L(),e={},req=[["fn","ln"],["ph"],["bd"],["lr","ds"],["vac"],["ex"],["sal"],["cn"]][S.step];
 req.forEach(k=>{if(D[k]===undefined||D[k]==="")e[k]=l.rq});
 if(S.step==1){if(D.ph&&D.ph.length<9)e.ph=l.bad;if(D.em&&!/^\S+@\S+\.\S+$/.test(D.em))e.em=l.bad}
 if(S.step==2&&D.bd&&!vd(D.bd))e.bd=l.bad;
 if(S.step==5&&D.ex===7&&!D.xt)e.ex=l.rq;
 if(S.step==6&&D.sal===4&&!D.salt)e.sal=l.rq;
 S.err=e;return!Object.keys(e).length}

function payload(){const D=S.D,x=VC[D.vac];return{lang:S.lang,vacancy:x[0][0],first_name:D.fn,last_name:D.ln,full_name:D.fn+" "+D.ln,birth_date:D.bd,age:age(D.bd),phone:"+998"+D.ph,email:D.em||"",live_region:RG[D.lr][0],district:D.ds,education:"",experience:D.ex===7?D.xt:EL[0][D.ex],expected_salary:D.sal===4?D.salt+" so'm":SL[0][D.sal],about:""}}

async function send(){S.st=1;render();try{if(!(tg&&tg.initData))throw 0;const r=await fetch("/api/apply",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({initData:tg.initData,payload:payload()})});if(!(await r.json()).ok)throw 0;S.st=2}catch(e){if(tg&&tg.initData&&!tg.initDataUnsafe.query_id){tg.sendData(JSON.stringify(payload()));return}S.st=3}render()}

document.addEventListener("click",e=>{const b=e.target.closest("button,[data-c],[data-vo]");if(!b)return;const d=b.dataset;
 if(d.a=="lm"){S.lm=!S.lm}else if(d.a=="tg"){S.th=document.documentElement.dataset.th=="dark"?"light":"dark";ls.s("th",S.th)}
 else if(d.l){S.lang=d.l;S.lm=0;ls.s("lang",S.lang)}
 else if(d.vo!==undefined){S.vopen=S.vopen==+d.vo?-1:+d.vo}
 else if(d.a=="fin"){if(tg&&tg.close)tg.close();S.D={};S.err={};S.vopen=-1;S.step=0;S.st=0}
 else if(d.a=="nx"){if(!ok()){render();return}if(S.step<7){S.step++;S.err={}}else{send();return}}
 else if(d.a=="bk"){S.step--;S.err={}}
 else if(d.a=="dp"){const p=$("#dp");try{p.showPicker()}catch(x){p.click()};return}
 else if(d.c){const[k,v]=d.c.split(":");S.D[k]=+v;delete S.err[k]}else return;render()});
document.addEventListener("input",e=>{const t=e.target,d=t.dataset;if(d.bd!==undefined){const g=t.value.replace(/\D/g,"").slice(0,8);t.value=g.replace(/^(\d{2})(\d)/,"$1.$2").replace(/^(\d{2})\.(\d{2})(\d)/,"$1.$2.$3");S.D.bd=t.value}
 else if(d.ph!==undefined){S.D.ph=t.value.replace(/\D/g,"").slice(0,9);t.value=fp(S.D.ph)}else if(d.k)S.D[d.k]=t.value;else if(d.cb!==undefined){S.D.cn=t.checked}
 else if(t.id=="dp"&&t.value){const[y,m,dd]=t.value.split("-");S.D.bd=dd+"."+m+"."+y;render()}});
document.addEventListener("change",e=>{const t=e.target;if(t.dataset.s){S.D[t.dataset.s]=t.value;delete S.err[t.dataset.s];render()}});
if(tg){tg.ready();tg.expand()}
render();setTimeout(()=>{$("#sp").classList.add("out");setTimeout(()=>$("#sp").remove(),400)},1900);
</script></body></html>
