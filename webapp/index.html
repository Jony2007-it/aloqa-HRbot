function dpView(){const l=L(),m=MN[I()];

  </div></div>`;
 }
 return `<div class="ov" data-ov="1"><div><h3>${l.dpt}</h3><div class="row">${picker}</div><div class="ft" style="position:static;border:0;padding:18px 0 0"><button class="btn g" data-a="dpc" style="flex:.6">${l.dpc}</button><button class="btn" data-a="dpok">${l.dpok}</button></div></div></div>${sub}`}

 }
 if(s==5)h=fld("vac","",VC.map((v,i)=>{const x=v[I()],exp=S.vopen===i;return`<div class="vch ${D.vac===i?"on":""}" style="--cc:${cc(i)};--cb:${hx(cc(i),.1)}">${poster(i)}<div class="vrow" data-c="vac:${i}"><span style="flex:1;min-width:0"><b>${x[0]}</b><br><span class="mu sm">${x[1]}</span><br><span class="sal">${salIc}${offerTxt(i)}</span></span><u></u></div><button type="button" class="mu sm" data-vo="${i}" style="background:none;border:0;padding:9px 0 0;text-decoration:underline;cursor:pointer">${l.rm} ${exp?"▲":"▼"}</button>${exp?`<ul style="margin:6px 0 0 18px;color:var(--mu);font-size:12.5px">${x[2].map(r=>`<li>${r}</li>`).join("")}</ul>`:""}</div>`}).join(""));

function ok(){const D=S.D,l=L(),e={},req=[["fn","ln"],["ph"],["bd"],["lr","ds"],["wr"],["vac"],["ex"],[],["sal"],["cn"]][S.step];
 req.forEach(k=>{if(D[k]===undefined||D[k]==="")e[k]=l.rq});

async function send(){
 S.st=1;render();
 try{
  if(!(tg&&tg.initData))throw new Error("no-telegram");
  const r=await fetch("/api/apply",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({initData:tg.initData,payload:payload()})});
  const j=await r.json();
  if(!j.ok)throw new Error(j.error||"fail");
  S.st=2;
 }catch(e){ S.st=3; }
 render()}

function handleFile(e){

}
